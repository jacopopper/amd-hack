<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Step Wise · Room renderer</title>
<style>
html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#141b20;font:12px system-ui;color:#d9e0e5}canvas{display:block;touch-action:none}#status{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}#pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;left:0;top:0;border:0;background:transparent;color:white;cursor:pointer;pointer-events:auto;display:flex;gap:7px;align-items:center;visibility:hidden}.pin b{display:grid;place-items:center;width:29px;height:29px;border:2px dashed white;border-radius:50%;box-shadow:0 2px 14px #0008;color:#17191c;font-size:12px}.pin span{font-size:10px;white-space:nowrap;background:#11171de6;padding:6px 8px;border:1px solid #ffffff26;border-radius:5px;box-shadow:0 2px 12px #0004}.pin:focus-visible{outline:3px solid #c5defb;outline-offset:4px}.pin[aria-pressed=true] b{box-shadow:0 0 0 6px #ffffff22,0 2px 14px #0008}
</style>
<script type="importmap">{"imports":{"three":"/capture-data/vendor/three.module.js"}}</script>
</head>
<body><div id="stage"></div><div id="pins"></div><div id="status" role="status">Loading the reconstruction…</div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from '/capture-data/vendor/OrbitControls.js';
import {PLYLoader} from '/capture-data/vendor/PLYLoader.js';
import {Viewer,SceneRevealMode,RenderMode} from '/capture-data/vendor/splats.js';
const stage=document.querySelector('#stage'),status=document.querySelector('#status'),pins=document.querySelector('#pins');
const emit=(type,extra={})=>parent.postMessage({channel:'step-wise-room',type,...extra},location.origin);
let renderer,viewer,controls,observer,disposed=false;
try{
  const json=async file=>{const response=await fetch('/capture-data/'+file);if(!response.ok)throw Error(`${file}: HTTP ${response.status}`);return response.json()};
  const [data,findings]=await Promise.all([json('viewpoints.json'),json('hazards.json')]);
  renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setClearColor('#141b20');stage.append(renderer.domElement);
  renderer.domElement.setAttribute('aria-label','3D reconstruction: drag to orbit, scroll to zoom');
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(65,1,.003,100);
  controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true;controls.dampingFactor=.09;controls.minDistance=.015;controls.maxDistance=5;
  controls.zoomSpeed=.6;controls.rotateSpeed=.55;
  let mesh,points,current=23,mode='splats',selected='carpet';
  let dirty=true;
  const invalidate=()=>{dirty=true;viewer?.forceRenderNextFrame()};
  controls.addEventListener('change',invalidate);
  const setView=index=>{
    current=(index+data.views.length)%data.views.length;
    const v=data.views[current],matrix=new THREE.Matrix4().set(...v.world_to_camera.flat()).invert();
    camera.position.setFromMatrixPosition(matrix);
    camera.up.copy(new THREE.Vector3(0,-1,0).transformDirection(matrix));
    controls.target.copy(camera.position).addScaledVector(new THREE.Vector3(0,0,1).transformDirection(matrix),.65);
    camera.fov=2*Math.atan(518/(2*v.intrinsics[1][1]))*180/Math.PI;
    camera.lookAt(controls.target);camera.updateProjectionMatrix();controls.update();
    invalidate();
    window.captureViewIndex=current;emit('view',{index:current});
  };
  const setMode=value=>{
    mode=value;
    if(mesh)mesh.visible=value==='surface'||(!window.splatsReady&&value==='splats');
    if(points)points.visible=value==='points';
    if(viewer)viewer.splatMesh.visible=value==='splats';
    pins.style.display=value==='photo'?'none':'block';
    window.captureMode=value;
    invalidate();
  };
  const highlight=id=>{selected=id;for(const f of findings)f.element.setAttribute('aria-pressed',String(f.id===id))};
  const markers=findings.map((finding,i)=>{
    const element=document.createElement('button');element.className='pin';
    element.setAttribute('aria-label',`Demo hazard ${i+1}: ${finding.label}`);
    element.title=finding.uncertainty;
    const disc=document.createElement('b');disc.textContent=i+1;disc.style.background=finding.color;
    const text=document.createElement('span');text.textContent=finding.label+' · demo';
    element.append(disc,text);pins.append(element);finding.element=element;
    element.onclick=()=>{highlight(finding.id);setView(finding.view_index);emit('select',{id:finding.id})};
    return {element,point:new THREE.Vector3(...finding.position_world)};
  });
  highlight(selected);setView(current);
  observer=new ResizeObserver(()=>{
    const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
    invalidate();
  });observer.observe(stage);
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='step-wise-room')return;
    const command=event.data;
    if(command.type==='view'&&Number.isInteger(command.index))setView(command.index);
    if(command.type==='reset')setView(current);
    if(command.type==='highlight')highlight(command.id);
    if(command.type==='mode'&&['splats','surface','points','photo'].includes(command.value))setMode(command.value);
  });
  renderer.setAnimationLoop(()=>{
    if(disposed)return;
    controls.update();
    if(viewer&&window.splatsReady){
      viewer.update(renderer,camera);
      if(viewer.shouldRender()||dirty){viewer.render();window.captureFrame=(window.captureFrame||0)+1}
      viewer.renderNextFrame=false;
    }else if(dirty)renderer.render(scene,camera);
    dirty=false;
    for(const marker of markers){
      const p=marker.point.clone().project(camera);
      const visible=p.z>-1&&p.z<1&&Math.abs(p.x)<.93&&Math.abs(p.y)<.9;
      marker.element.style.visibility=visible?'visible':'hidden';
      // Markers are indicative navigation aids, intentionally not occlusion-tested.
      marker.element.style.transform=`translate(-15px,-15px) translate(${(p.x+1)*stage.clientWidth/2}px,${(1-p.y)*stage.clientHeight/2}px)`;
    }
  });
  const geometry=await new PLYLoader().loadAsync('/capture-data/observed.ply');
  mesh=new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.DoubleSide}));
  points=new THREE.Points(geometry,new THREE.PointsMaterial({vertexColors:true,size:.002,sizeAttenuation:true}));
  scene.add(mesh,points);setMode(mode);status.remove();window.captureReady=true;emit('ready');
  emit('status',{text:'Surfaces ready · loading Gaussian splats…'});
  viewer=new Viewer({selfDrivenMode:false,renderer,camera,threeScene:scene,useBuiltInControls:false,
    sharedMemoryForWorkers:false,gpuAcceleratedSort:false,integerBasedSort:false,
    sphericalHarmonicsDegree:2,sceneRevealMode:SceneRevealMode.Instant,renderMode:RenderMode.OnChange,
    rootElement:stage,ignoreDevicePixelRatio:false,antialiased:false,kernel2DSize:.3});
  emit('status',{text:'Loading polished surfaces…'});
  await viewer.addSplatScene('/capture-data/room-polished.ply',
    {splatAlphaRemovalThreshold:5,showLoadingUI:false,progressiveLoad:false});
  window.splatsReady=true;window.capturePolished=true;setMode(mode);emit('splats-ready');
  const clean=()=>{disposed=true;renderer.setAnimationLoop(null);observer.disconnect();controls.dispose();viewer?.dispose();renderer.dispose()};
  window.addEventListener('pagehide',clean,{once:true});
}catch(error){
  console.error(error);window.captureError=error.message;emit('error',{text:error.message});
  status.textContent='Reconstruction unavailable: '+error.message;
}
</script></body></html>
