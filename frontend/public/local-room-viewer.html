<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Step Wise · Room renderer</title>
<style>
html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#141b20;font:12px system-ui;color:#d9e0e5}canvas{display:block;touch-action:none}#pins{position:absolute;inset:0;pointer-events:none}.pin{position:absolute;left:0;top:0;border:0;background:transparent;color:white;cursor:pointer;pointer-events:auto;display:flex;gap:7px;align-items:center;visibility:hidden}.pin b{display:grid;place-items:center;width:29px;height:29px;border:2px dashed white;border-radius:50%;box-shadow:0 2px 14px #0008;color:#17191c;font-size:12px}.pin span{font-size:10px;white-space:nowrap;background:#11171de6;padding:6px 8px;border:1px solid #ffffff26;border-radius:5px;box-shadow:0 2px 12px #0004}.pin:focus-visible{outline:3px solid #c5defb;outline-offset:4px}.pin[aria-pressed=true] b{box-shadow:0 0 0 6px #ffffff22,0 2px 14px #0008}
</style>
<script type="importmap">{"imports":{"three":"/capture-data/vendor/three.module.js"}}</script>
</head>
<body><div id="stage"></div><div id="pins"></div>
<script type="module">
// Embedded by CaptureStage: streams the compressed splats and keeps the hazard pins in sync over postMessage.
import * as THREE from 'three';
import {OrbitControls} from '/capture-data/vendor/OrbitControls.js';
import {Viewer,SceneRevealMode,RenderMode} from '/capture-data/vendor/splats.js';
const stage=document.querySelector('#stage'),pins=document.querySelector('#pins');
const emit=(type,extra={})=>parent.postMessage({channel:'step-wise-room',type,...extra},location.origin);
let renderer,viewer,controls,observer,disposed=false;
try{
  const json=async file=>{const response=await fetch('/capture-data/'+file);if(!response.ok)throw Error(`${file}: HTTP ${response.status}`);return response.json()};
  const [data,findings]=await Promise.all([json('viewpoints.json'),json('hazards.json')]);
  renderer=new THREE.WebGLRenderer({antialias:true});
  const sharpRatio=Math.min(devicePixelRatio,2);
  renderer.setPixelRatio(sharpRatio);
  renderer.setClearColor('#141b20');stage.append(renderer.domElement);
  renderer.domElement.setAttribute('aria-label','Home in 3D: drag to rotate, scroll to zoom');
  const camera=new THREE.PerspectiveCamera(65,1,.003,100);
  controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=false;controls.minDistance=.015;controls.maxDistance=5;
  controls.zoomSpeed=.6;controls.rotateSpeed=.55;
  viewer=new Viewer({selfDrivenMode:false,renderer,camera,useBuiltInControls:false,
    sharedMemoryForWorkers:false,gpuAcceleratedSort:false,integerBasedSort:false,
    sphericalHarmonicsDegree:1,sceneRevealMode:SceneRevealMode.Instant,renderMode:RenderMode.OnChange,
    rootElement:stage,ignoreDevicePixelRatio:false,antialiased:false,kernel2DSize:.3});
  // Draw for a short settle window after any change: the library finishes sorts and uploads over a few frames.
  let current=23,drawUntil=0,sorting=false,probe=false;
  const invalidate=(ms=400)=>{drawUntil=Math.max(drawUntil,performance.now()+ms)};
  controls.addEventListener('change',()=>invalidate());
  // Splats are fill-rate bound (a quarter of the pixels draws ~3x faster on integrated GPUs):
  // drag at half resolution, then redraw sharp as soon as the drag ends.
  const setRatio=ratio=>{renderer.setPixelRatio(ratio);invalidate()};
  setRatio(sharpRatio);
  controls.addEventListener('start',()=>setRatio(sharpRatio/2));
  controls.addEventListener('end',()=>setRatio(sharpRatio));
  const setView=index=>{
    current=(index+data.views.length)%data.views.length;
    const v=data.views[current],matrix=new THREE.Matrix4().set(...v.world_to_camera.flat()).invert();
    camera.position.setFromMatrixPosition(matrix);
    camera.up.copy(new THREE.Vector3(0,-1,0).transformDirection(matrix));
    controls.target.copy(camera.position).addScaledVector(new THREE.Vector3(0,0,1).transformDirection(matrix),.65);
    camera.fov=2*Math.atan(518/(2*v.intrinsics[1][1]))*180/Math.PI;
    camera.lookAt(controls.target);camera.updateProjectionMatrix();controls.update();
    invalidate();
  };
  const highlight=id=>{for(const f of findings)f.element.setAttribute('aria-pressed',String(f.id===id))};
  const markers=findings.map((finding,i)=>{
    const element=document.createElement('button');element.className='pin';
    element.setAttribute('aria-label',`Hazard ${i+1}: ${finding.label}`);
    element.title=finding.uncertainty;
    const disc=document.createElement('b');disc.textContent=i+1;disc.style.background=finding.color;
    const text=document.createElement('span');text.textContent=finding.label;
    element.append(disc,text);pins.append(element);finding.element=element;
    element.onclick=()=>{highlight(finding.id);setView(finding.view_index);emit('select',{id:finding.id})};
    return {element,point:new THREE.Vector3(...finding.position_world)};
  });
  setView(current);
  observer=new ResizeObserver(()=>{
    const w=stage.clientWidth,h=stage.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix();
    invalidate();
  });observer.observe(stage);
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==parent||event.data?.channel!=='step-wise-room')return;
    const command=event.data;
    if(command.type==='view'&&Number.isInteger(command.index))setView(command.index);
    if(command.type==='highlight')highlight(command.id);
    if(command.type==='labels')for(const f of findings){if(typeof command.labels?.[f.id]==='string')f.element.querySelector('span').textContent=command.labels[f.id];if(Number.isInteger(command.numbers?.[f.id]))f.element.querySelector('b').textContent=command.numbers[f.id]}
  });
  renderer.setAnimationLoop(()=>{
    if(disposed)return;
    controls.update();
    viewer.update(renderer,camera);
    // The library keeps its visible region flagged as changing and would redraw every frame, which
    // saturates integrated GPUs even while the room sits hidden behind the photos. Draw only while
    // splats stream in, shortly after the view changed, or when a depth sort just landed.
    const sorted=sorting&&!viewer.sortRunning;sorting=viewer.sortRunning;
    if(probe&&viewer.splatRenderReady&&!viewer.sortRunning){
      // Time one sharp frame: software rendering takes seconds, and then the photos serve the review better.
      probe=false;const gl=renderer.getContext(),started=performance.now();
      viewer.render();gl.readPixels(0,0,1,1,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array(4));
      window.captureFrameMs=Math.round(performance.now()-started);
      if(window.captureFrameMs>1500)emit('slow',{ms:window.captureFrameMs});
    }else if(performance.now()<drawUntil||sorted||(!window.splatsReady&&viewer.shouldRender()))viewer.render();
    for(const marker of markers){
      const p=marker.point.clone().project(camera);
      const visible=p.z>-1&&p.z<1&&Math.abs(p.x)<.93&&Math.abs(p.y)<.9;
      marker.element.style.visibility=visible?'visible':'hidden';
      // Markers are indicative navigation aids, intentionally not occlusion-tested.
      marker.element.style.transform=`translate(-15px,-15px) translate(${(p.x+1)*stage.clientWidth/2}px,${(1-p.y)*stage.clientHeight/2}px)`;
    }
  });
  const clean=()=>{disposed=true;renderer.setAnimationLoop(null);observer.disconnect();controls.dispose();viewer.dispose();renderer.dispose()};
  window.addEventListener('pagehide',clean,{once:true});
  emit('ready');
  // room.ksplat is the polished splat cloud, compressed by scripts/compress_splats.mjs; it renders while it streams.
  // While streaming, the library's promise settles after the first section and download failures surface
  // only as unhandled rejections, so completion comes from the progress callback instead.
  await new Promise((resolve,reject)=>{
    window.addEventListener('unhandledrejection',event=>reject(event.reason),{once:true});
    viewer.addSplatScene('/capture-data/room.ksplat',{showLoadingUI:false,progressiveLoad:true,
      onProgress:percent=>{if(percent>=100)resolve()}}).catch(reject);
  });
  window.splatsReady=true;probe=true;invalidate(1500);emit('splats-ready');
}catch(error){
  console.error(error);window.captureError=error.message;emit('error',{text:error.message});
}
</script></body></html>
