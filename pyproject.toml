[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "safe-home"
version = "0.1.0"
description = "Evidence-led staged home assessment prototype"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "pydantic>=2.10,<3", "uvicorn>=0.34,<1",
  "python-multipart>=0.0.20,<1", "Pillow>=11,<13", "requests>=2.32,<3",
  "numpy>=2,<3", "Jinja2>=3.1.5,<4", "WeasyPrint>=65,<70",
]

[project.optional-dependencies]
test = ["httpx>=0.28,<1"]

[project.scripts]
safe-home = "safe_home.cli:main"

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.setuptools.package-data]
safe_home = ["schema.sql", "prompts/*.txt", "templates/*.html"]
